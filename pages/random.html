<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>랜덤 추천 — 무뮤(MoodMusic)</title>
    <script>
        (function(){
            try {
                const t = localStorage.getItem('theme');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch(e){}
        })();
    </script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="logo" aria-label="무뮤 홈">무뮤(MoodMusic)</a>
        <nav>
            <ul class="nav">
                <li><a href="../index.html">메인</a></li>
                <li><a href="suggest.html">추천</a></li>
                <li><a href="random.html" class="active">랜덤</a></li>
                <li><a href="introduction.html">소개</a></li>
            </ul>
        </nav>
    </header>

    <main class="container center-content">
        <section class="random-card" id="randomCard">
            <h2>랜덤 추천</h2>
            <div id="randomSong" class="random-song">버튼을 눌러 랜덤으로 곡을 추천받으세요.</div>
            <div class="controls-row" style="display:flex;gap:12px;justify-content:center;align-items:center;margin-top:14px;">
                <a id="playLinkPlaceholder" class="play-btn" href="#" target="_blank" rel="noopener noreferrer" style="display:none">지금 듣기 (YouTube)</a>
                <button id="randomBtn" class="big-btn">다른 곡 추천받기</button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <small>© 무뮤 MoodMusic - 프로토타입</small>
    </footer>

    <!-- musicData 로드 -->
    <script src="../js/musicData.js"></script>

    <script>
        const btn = document.getElementById('randomBtn');
        const display = document.getElementById('randomSong');
        const playLinkPlaceholder = document.getElementById('playLinkPlaceholder');

        function escapeHtml(str){ return String(str || '').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

        function pickRandom() {
    if (!Array.isArray(musicData) || musicData.length === 0) {
        display.textContent = '추천 가능한 곡 데이터가 없습니다.';
        return;
    }
    const pick = musicData[Math.floor(Math.random()*musicData.length)];

    // 유튜브 링크 생성
    const yt = pick.youtubeId ? `https://www.youtube.com/watch?v=${encodeURIComponent(pick.youtubeId)}` : '#';

    // 썸네일 주소 생성
    const thumbUrl = pick.youtubeId ? `https://img.youtube.com/vi/${pick.youtubeId}/hqdefault.jpg` : '';

    // 현재 곡을 localStorage에 저장
    localStorage.setItem('currentRandomSong', JSON.stringify(pick));

    // 화면 출력: 카드 형태(썸네일 고정 크기 + 정보)
    display.innerHTML = `
        <div class="song-card" style="max-width:520px;">
            <div class="card-head">
                <a class="thumb-link" href="${yt}" target="_blank" rel="noopener noreferrer">
                    <div class="thumb">
                        ${thumbUrl ? `<img src="${thumbUrl}" alt="${escapeHtml(pick.title)} 썸네일">` : `<div class="no-thumb">No thumbnail</div>`}
                    </div>
                </a>
            </div>
            <div class="card-body">
                <div class="title">${escapeHtml(pick.title)}</div>
                <div class="meta">${escapeHtml(pick.artist)} · <span class="muted">${escapeHtml(pick.mood)}</span></div>
                <div class="desc muted">${escapeHtml(pick.desc || '')}</div>
            </div>
        </div>
    `;

    // play 버튼 링크 업데이트 및 보이기
    if (playLinkPlaceholder) {
        playLinkPlaceholder.href = yt;
        playLinkPlaceholder.style.display = yt === '#' ? 'none' : 'inline-block';
    }
}

        btn.addEventListener('click', pickRandom);

        // 로드 시: localStorage에 저장된 곡이 있으면 그걸 표시, 없으면 새로 뽑기
        const savedRandomSong = localStorage.getItem('currentRandomSong');
        if (savedRandomSong) {
            try {
                const pick = JSON.parse(savedRandomSong);
                const yt = pick.youtubeId ? `https://www.youtube.com/watch?v=${encodeURIComponent(pick.youtubeId)}` : '#';
                const thumbUrl = pick.youtubeId ? `https://img.youtube.com/vi/${pick.youtubeId}/hqdefault.jpg` : '';

                display.innerHTML = `
                    <div class="song-card" style="max-width:520px;">
                        <div class="card-head">
                            <a class="thumb-link" href="${yt}" target="_blank" rel="noopener noreferrer">
                                <div class="thumb">
                                    ${thumbUrl ? `<img src="${thumbUrl}" alt="${escapeHtml(pick.title)} 썸네일">` : `<div class="no-thumb">No thumbnail</div>`}
                                </div>
                            </a>
                        </div>
                        <div class="card-body">
                            <div class="title">${escapeHtml(pick.title)}</div>
                            <div class="meta">${escapeHtml(pick.artist)} · <span class="muted">${escapeHtml(pick.mood)}</span></div>
                            <div class="desc muted">${escapeHtml(pick.desc || '')}</div>
                        </div>
                    </div>
                `;

                if (playLinkPlaceholder) {
                    playLinkPlaceholder.href = yt;
                    playLinkPlaceholder.style.display = yt === '#' ? 'none' : 'inline-block';
                }
            } catch (e) {
                pickRandom();
            }
        } else {
            pickRandom();
        }
    </script>
</body>
</html>
