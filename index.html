<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>무뮤(MoodMusic)</title>
    <script>
        (function(){
            try {
                const t = localStorage.getItem('theme');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch(e){}
        })();
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo" aria-label="무뮤 홈">무뮤(MoodMusic)</a>
        <nav>
            <ul class="nav">
                <li><a href="index.html" class="active">메인</a></li>
                <li><a href="pages/suggest.html">추천</a></li>
                <li><a href="pages/random.html">랜덤</a></li>
                <li><a href="pages/introduction.html">소개</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="mood-section">
            <h2 class="sr">감정 선택</h2>
            <div class="mood-grid" id="moodGrid">
                <button data-mood="happy">기쁨</button>
                <button data-mood="sad">슬픔</button>
                <button data-mood="calm">평온</button>
                <button data-mood="angry">분노</button>
            </div>
        </section>

        <!-- 플레이어 카드(가로 3개) -->
        <section class="player-section">
            <h3>추천곡</h3>
            <div id="playerGrid" class="player-grid" aria-live="polite">
                <!-- 카드 3개가 여기 렌더됩니다 -->
            </div>
            <div class="player-controls" style="text-align:center;margin-top:12px;">
                <button id="refreshBtn" class="refresh-btn">새로고침</button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <small>© 무뮤 MoodMusic - 프로토타입</small>
    </footer>

    <!-- musicData 로드 -->
    <script src="js/musicData.js"></script>

    <script>
        // musicData.js 의 musicData 배열 사용
        const moodKeyToLabel = {
            happy: '기쁨',
            sad: '슬픔',
            calm: '평온',
            angry: '분노'
        };

        const moodGrid = document.getElementById('moodGrid');
        const playerGrid = document.getElementById('playerGrid');

        // n개 무작위 선택 (Fisher-Yates 섞기 후 slice)
        function pickNRandom(arr, n) {
            if (!Array.isArray(arr)) return [];
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a.slice(0, n);
        }

        function makeSongCard(song) {
            const card = document.createElement('div');
            card.className = 'song-card';

            const youtubeId = song.youtubeId || '';
            const thumbUrl = youtubeId ? `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg` : '';

            card.innerHTML = `
                <div class="card-head">
                    <a class="thumb-link" href="https://www.youtube.com/watch?v=${encodeURIComponent(youtubeId)}" target="_blank" rel="noopener noreferrer">
                        <div class="thumb">
                            ${thumbUrl ? `<img src="${thumbUrl}" alt="${escapeHtml(song.title)} 썸네일">` :
                            `<div class="no-thumb">No thumbnail</div>`}
                        </div>
                    </a>
                </div>
                <div class="card-body">
                    <div class="title">${escapeHtml(song.title)}</div>
                    <div class="meta">${escapeHtml(song.artist)} · <span class="muted">${escapeHtml(song.genre)}</span></div>
                    <div class="desc muted">${escapeHtml(song.desc || '')}</div>
                    <div class="card-actions">
                        <a class="play-btn" href="https://www.youtube.com/watch?v=${encodeURIComponent(youtubeId)}" target="_blank" rel="noopener noreferrer">듣기 (YouTube)</a>
                    </div>
                </div>
            `;

            return card;
        }

        function renderForMood(moodKey) {
            let pool = Array.isArray(musicData) ? musicData : [];
            if (moodKey && moodKeyToLabel[moodKey]) {
                const label = moodKeyToLabel[moodKey];
                pool = pool.filter(s => s.mood === label);
            }
            const picks = pickNRandom(pool, 3);
            playerGrid.innerHTML = '';
            if (!picks.length) {
                playerGrid.innerHTML = '<div class="placeholder">추천곡이 없습니다.</div>';
                return;
            }
            // 감정별로 3곡을 localStorage에 저장
            const storageKey = moodKey ? `songs_${moodKey}` : 'songs_all';
            localStorage.setItem(storageKey, JSON.stringify(picks));
            picks.forEach(song => playerGrid.appendChild(makeSongCard(song)));
        }

        // 초기 로드: 저장된 테마의 곡들을 불러오기
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            const btn = document.querySelector(`.mood-grid button[data-mood="${savedTheme}"]`);
            if (btn) btn.classList.add('selected');
        }
        
        const storageKey = savedTheme ? `songs_${savedTheme}` : 'songs_all';
        const savedSongs = localStorage.getItem(storageKey);
        if (savedSongs) {
            try {
                const songs = JSON.parse(savedSongs);
                if (Array.isArray(songs) && songs.length > 0) {
                    playerGrid.innerHTML = '';
                    songs.forEach(song => playerGrid.appendChild(makeSongCard(song)));
                } else {
                    renderForMood(savedTheme || null);
                }
            } catch (e) {
                renderForMood(savedTheme || null);
            }
        } else {
            renderForMood(savedTheme || null);
        }

        moodGrid.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-mood]');
            if (!btn) return;
            document.querySelectorAll('.mood-grid button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            const mood = btn.dataset.mood; // english key
            // 테마 적용 및 저장
            document.documentElement.setAttribute('data-theme', mood);
            localStorage.setItem('theme', mood);

            // 해당 감정의 저장된 곡이 있으면 표시, 없으면 새로 생성
            const storageKey = `songs_${mood}`;
            const savedMoodSongs = localStorage.getItem(storageKey);
            if (savedMoodSongs) {
                try {
                    const songs = JSON.parse(savedMoodSongs);
                    if (Array.isArray(songs) && songs.length > 0) {
                        playerGrid.innerHTML = '';
                        songs.forEach(song => playerGrid.appendChild(makeSongCard(song)));
                        return;
                    }
                } catch (e) {}
            }
            renderForMood(mood);
        });

        // 새로고침 버튼: 같은 감정(또는 전체)에서 3곡을 재샘플
        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', () => {
                const sel = document.querySelector('.mood-grid button.selected');
                const mood = sel ? sel.dataset.mood : null;
                renderForMood(mood);
            });
        }

        function escapeHtml(str){ return String(str || '').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    </script>
</body>
</html>
